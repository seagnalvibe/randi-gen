[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "randi-gen"
version = "0.1.0"
description = "Génération de cartes 3D (lat, lon, azimut) NetCDF de bruit ambiant sous-marin directif, modèle de type RANDI piloté par des statistiques AIS"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "xarray>=2023.1",
    "netCDF4>=1.6",
    "matplotlib>=3.7",
    "plotly>=5.18",
    "requests>=2.28",
]

[project.optional-dependencies]
ui = ["streamlit>=1.30"]
test = ["pytest>=7"]

[project.scripts]
randi-gen = "randi_gen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
